name: CI/CD — Frontend RedNorte

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Tests unitarios + cobertura
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      - name: Instalar dependencias (incluye workspace @rednorte/badge)
        run: npm ci

      - name: Ejecutar tests con cobertura
        run: npm test -- --coverage --watchAll=false
        env:
          CI: true

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura-frontend
          path: coverage/
          retention-days: 7

  build:
    name: Build de produccion
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build de produccion
        run: npm run build
        env:
          CI: true

      - name: Publicar artefacto de build
        uses: actions/upload-artifact@v4
        with:
          name: build-frontend
          path: build/
          retention-days: 7
